<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math 2 Today</title>
<style>
  :root { --teal:#376f7a; --teal2:#4c8c8c; --cream:#fff4e6; --peach:#ffe6cc; --gold:#d99a3d; --ink:#263b40; --today:#fff2a8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: "Helvetica Neue", Arial, sans-serif; color:var(--ink); background:var(--cream); }
  .wrap { padding:12px 14px; text-align:center; }
  .label { margin:0 0 4px; font-size:1.05rem; font-weight:700; }
  .sub { margin:0 0 12px; font-size:.95rem; }
  .btn { display:inline-block; background:var(--teal); color:#fff; font-size:1.35rem; text-decoration:none;
         padding:.65rem 1.5rem; border-radius:8px; margin:4px 6px; }
  .btn:hover { background:#2b5962; }
  .btn.off { background:#9fb5b9; cursor:default; }
  .note { font-size:.85rem; color:#5b6b6e; margin-top:8px; }
  table { border-collapse:collapse; width:100%; font-size:.95rem; text-align:left; }
  th { background:var(--teal2); color:#fff; padding:.45rem .5rem; }
  td { padding:.4rem .5rem; border-bottom:1px solid #f1dcc2; vertical-align:top; }
  tr:nth-child(even) td { background:var(--peach); }
  tr.today td { background:var(--today) !important; font-weight:600; }
  tr.off td { color:#7c7c7c; background:#eeeeee !important; }
  tr.unit td { background:var(--teal2) !important; color:#fff; font-weight:700; }
  td a { color:var(--teal); }
  h3 { margin:0 0 8px; color:var(--teal2); }
</style>
</head>
<body>
<div class="wrap" id="app"><p class="sub">Loading today's work…</p></div>
<script>
/* ===== SETTINGS: paste your Student View CSV link here ===== */
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQelJp9R95FwavTfcew_juMSE6nhqAzJcpArV7Vb0VO37QdrbCQ2E1Z5imUbnMgcs0LUM6l0CpcvCO2/pub?gid=1341448792&single=true&output=csv";
const SCHOOL_YEAR_START = 2026;        // Aug–Dec = 2026, Jan–Jul = 2027
/* ============================================================ */

const view = new URLSearchParams(location.search).get("view") || "buttons";   // "buttons" or "week"

function parseCSV(t){const r=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++;}else q=false;}else f+=c;}
  else if(c=='"')q=true;else if(c==','){row.push(f);f="";}else if(c=='\n'){row.push(f);r.push(row);row=[];f="";}else if(c!='\r')f+=c;}
  if(f||row.length){row.push(f);r.push(row);}return r;}

function toDate(s){const m=(s||"").match(/(\d{1,2})\/(\d{1,2})/);if(!m)return null;const mo=+m[1],d=+m[2];
  return new Date(mo>=7?SCHOOL_YEAR_START:SCHOOL_YEAR_START+1,mo-1,d);}
const sameDay=(a,b)=>a&&b&&a.toDateString()===b.toDateString();
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const offDay=t=>/no school/i.test(t||"");

function button(label,title,link){
  if(link) return `<a class="btn" href="${esc(link)}" target="_top" title="${esc(title)}">${esc(label)}</a>`;
  if(title) return `<span class="btn off" title="Link coming soon">${esc(label)}</span>`;
  return "";
}

fetch(CSV_URL + (CSV_URL.includes("?")?"&":"?") + "t=" + Date.now())
 .then(r=>{if(!r.ok)throw new Error(r.status);return r.text();})
 .then(txt=>{
  const rows=parseCSV(txt), head=rows[0]||[];
  const H=i=>(head[i]||"").trim();
  const wuLabel=H(3)||"Warm Up", etLabel=H(4)||"Quiz";
  let unit="";
  const days=[];
  rows.slice(1).forEach(r=>{
    const [wk,date,topic,wu,et,wuLink,etLink]=r;
    if(!date && wk){unit=wk;return;}
    const d=toDate(date); if(!d)return;
    days.push({d,date,topic,wu,et,wuLink,etLink,unit});
  });
  const now=new Date(); now.setHours(0,0,0,0);
  const app=document.getElementById("app");

  if(view==="week"){
    const mon=new Date(now); const dow=now.getDay();
    mon.setDate(now.getDate()-((dow+6)%7) + (dow===6||dow===0?7:0));   // weekends show next week
    const end=new Date(mon); end.setDate(mon.getDate()+12);           // this week + next week
    const list=days.filter(x=>x.d>=mon && x.d<=end);
    let html=`<h3>📅 This Week &amp; Next Week</h3><table><thead><tr><th>Date</th><th>Topic</th><th>${esc(wuLabel)}</th><th>${esc(etLabel)}</th></tr></thead><tbody>`;
    let lastUnit="";
    list.forEach(x=>{
      if(x.unit!==lastUnit){html+=`<tr class="unit"><td colspan="4">${esc(x.unit)}</td></tr>`;lastUnit=x.unit;}
      const cls=sameDay(x.d,now)?"today":(offDay(x.topic)?"off":"");
      const l=(t,u)=>u?`<a href="${esc(u)}" target="_top">${esc(t)}</a>`:esc(t);
      html+=`<tr class="${cls}"><td>${esc(x.date)}</td><td>${esc(x.topic)}</td><td>${l(x.wu,x.wuLink)}</td><td>${l(x.et,x.etLink)}</td></tr>`;
    });
    app.innerHTML=html+"</tbody></table>"+(list.length?"":`<p class="note">No class days on the calendar for these two weeks.</p>`);
    return;
  }

  // buttons view: today, or the next class day if today has no class
  let pick=days.find(x=>sameDay(x.d,now)&&!offDay(x.topic));
  let label="👇 Today's work is here 👇";
  if(!pick){pick=days.find(x=>x.d>now&&!offDay(x.topic)); if(pick) label=`👇 Next class: ${esc(pick.date)} 👇`;}
  if(!pick){app.innerHTML=`<p class="label">No upcoming class days on the calendar.</p>`;return;}
  const b=button(wuLabel,pick.wu,pick.wuLink)+button(etLabel,pick.et,pick.etLink);
  app.innerHTML=`<p class="label">${label}</p><p class="sub">${esc(pick.topic)}</p>`+(b||`<p class="note">No warm up or quiz today.</p>`);
 })
 .catch(()=>{document.getElementById("app").innerHTML=`<p class="note">Today's work couldn't load. Check the Math 2 calendar in Canvas.</p>`;});
</script>
</body>
</html>
