<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math 2 Today</title>
<style>
  :root { --teal:#376f7a; --teal2:#4c8c8c; --cream:#fff4e6; --peach:#ffe6cc; --gold:#d99a3d; --ink:#263b40; --today:#fff2a8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: "Helvetica Neue", Arial, sans-serif; color:var(--ink); background:var(--cream); }
  .wrap { padding:12px 14px; text-align:center; }
  .label { margin:0 0 4px; font-size:1.05rem; font-weight:700; }
  .sub { margin:0 0 12px; font-size:.95rem; }
  .btn { display:inline-block; background:var(--teal); color:#fff; font-size:1.35rem; text-decoration:none;
         padding:.65rem 1.5rem; border-radius:8px; margin:4px 6px; }
  .btn:hover { background:#2b5962; }
  .btn.off { background:#9fb5b9; cursor:default; }
  .note { font-size:.85rem; color:#5b6b6e; margin-top:8px; }
  table { border-collapse:collapse; width:100%; font-size:.95rem; text-align:left; }
  th { background:var(--teal2); color:#fff; padding:.45rem .5rem; }
  td { padding:.4rem .5rem; border-bottom:1px solid #f1dcc2; vertical-align:top; }
  tr:nth-child(even) td { background:var(--peach); }
  tr.today td { background:var(--today) !important; font-weight:600; }
  tr.off td { color:#7c7c7c; background:#eeeeee !important; }
  tr.unit td { background:var(--teal2) !important; color:#fff; font-weight:700; }
  td a { color:var(--teal); }
  h3 { margin:0 0 8px; color:var(--teal2); }
  .scroller{height:calc(100vh - 52px);overflow-y:auto;border:2px solid var(--teal2);border-radius:10px;background:#fff}
  .scroller table thead th{position:sticky;top:0;z-index:2}
  tr.past td{color:#8a8a8a}
  .mini{display:inline-block;background:var(--teal);color:#fff !important;text-decoration:none;padding:.2rem .55rem;border-radius:6px;font-size:.88rem;margin:1px 0}
  .mini.off{background:#9fb5b9}
  td.sm{font-size:.85rem}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px}
  .topbar h3{margin:0} .jump{background:var(--gold);color:#fff;border:none;border-radius:6px;padding:.3rem .7rem;font:inherit;font-size:.9rem;cursor:pointer}
  body.scrollview .wrap{padding:8px 10px}
  .unitbox{background:#fff;border:3px solid var(--teal2);border-radius:12px;padding:10px 14px;text-align:left}
  .uname{margin:0 0 4px;font-size:.9rem;font-weight:700;color:var(--teal2);text-transform:uppercase;letter-spacing:.03em}
  .uq{margin:0 0 6px;font-size:1.12rem;font-weight:700;line-height:1.3}
  .wwh{display:grid;grid-template-columns:78px 1fr;gap:8px;padding:4px 0;border-top:1px solid #f1dcc2;font-size:.93rem;line-height:1.35}
  .wwhl{font-weight:700;color:var(--teal)}
  @media (max-width:480px){.wwh{grid-template-columns:1fr;gap:0}}
  .cibox{background:#fff;border:3px solid var(--gold);border-radius:10px;padding:12px 16px;text-align:left}
  .cidate{margin:0 0 6px;font-size:.95rem;color:#5b6b6e}
  .cilabel{margin:0 0 4px;font-weight:700;color:var(--teal)}
  .ciq{margin:0;font-size:1.2rem;font-weight:600;line-height:1.4}
  .todaybox{text-align:center;background:var(--cream);border:3px solid var(--gold);border-radius:10px;padding:10px;margin:0 0 12px}
  body.both .scroller{height:70vh}
  body.both{max-width:1000px;margin:0 auto}

</style>
</head>
<body>
<div class="wrap" id="app"><p class="sub">Loading today's work…</p></div>
<script>
/* ===== SETTINGS: paste your Student View CSV link here ===== */
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQelJp9R95FwavTfcew_juMSE6nhqAzJcpArV7Vb0VO37QdrbCQ2E1Z5imUbnMgcs0LUM6l0CpcvCO2/pub?gid=1341448792&single=true&output=csv";
const SCHOOL_YEAR_START = 2026;        // Aug–Dec = 2026, Jan–Jul = 2027
/* ============================================================ */

const view = new URLSearchParams(location.search).get("view") || "scroll";   // "scroll" (default), "both", "buttons", "week", "debug"

function parseCSV(t){const r=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++;}else q=false;}else f+=c;}
  else if(c=='"')q=true;else if(c==','){row.push(f);f="";}else if(c=='\n'){row.push(f);r.push(row);row=[];f="";}else if(c!='\r')f+=c;}
  if(f||row.length){row.push(f);r.push(row);}return r;}

function toDate(s){const m=(s||"").match(/(\d{1,2})\/(\d{1,2})/);if(!m)return null;const mo=+m[1],d=+m[2];
  return new Date(mo>=7?SCHOOL_YEAR_START:SCHOOL_YEAR_START+1,mo-1,d);}
const sameDay=(a,b)=>a&&b&&a.toDateString()===b.toDateString();
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const offDay=t=>/no school/i.test(t||"");

function button(label,title,link){
  if(link) return `<a class="btn" href="${esc(link)}" target="_top" title="${esc(title)}">${esc(label)}</a>`;
  if(title) return `<span class="btn off" title="Link coming soon">${esc(label)}</span>`;
  return "";
}

fetch(CSV_URL + (CSV_URL.includes("?")?"&":"?") + "t=" + Date.now())
 .then(r=>{if(!r.ok)throw new Error(r.status);return r.text();})
 .then(txt=>{
  const rows=parseCSV(txt), head=rows[0]||[];
  const H=i=>(head[i]||"").trim();
  const col=(name,fallback)=>{const i=head.findIndex(h=>h.trim().toLowerCase()===name.toLowerCase());return i>=0?i:fallback;};
  const C={wk:0,date:1,topic:col("Topic",2),wu:col("Warm Up",3),et:col("Quiz",4),wuLink:col("WU Link",5),etLink:col("ET Link",6),prac:col("Practice",-1),ci:col("Check In",-1),what:col("What",-1),why:col("Why",-1),how:col("How",-1)};
  const wuLabel=H(C.wu)||"Warm Up", etLabel=H(C.et)||"Quiz";
  let unit="";
  const days=[], units={};
  rows.slice(1).forEach(r=>{
    const g=k=>C[k]>=0?(r[C[k]]||""):"";
    const wk=g("wk"),date=g("date");
    if(!date && wk){unit=wk;units[wk]={q:g("topic"),what:g("what"),why:g("why"),how:g("how")};return;}
    const d=toDate(date); if(!d)return;
    days.push({d,date,topic:g("topic"),wu:g("wu"),et:g("et"),wuLink:g("wuLink"),etLink:g("etLink"),prac:g("prac"),ci:g("ci"),unit});
  });
  const now=new Date(); now.setHours(0,0,0,0);
  const app=document.getElementById("app");

  if(view==="debug"){
    app.style.textAlign="left";
    app.innerHTML=`<p><b>Rows read:</b> ${rows.length} &nbsp; <b>Class days found:</b> ${days.length} &nbsp; <b>Today:</b> ${now.toDateString()}</p>`+
      `<p><b>First 6 lines of the CSV:</b></p><pre style="white-space:pre-wrap;font-size:12px">${esc(txt.split("\n").slice(0,6).join("\n"))}</pre>`+
      (days.length?`<p><b>First day:</b> ${esc(days[0].date)} &nbsp; <b>Last day:</b> ${esc(days[days.length-1].date)}</p>`:"");
    return;
  }

  function buttonsHTML(){
    let pick=days.find(x=>sameDay(x.d,now)&&!offDay(x.topic));
    let label="👇 Today's work is here 👇";
    if(!pick){pick=days.find(x=>x.d>now&&!offDay(x.topic)); if(pick) label=`👇 Next class: ${esc(pick.date)} 👇`;}
    if(!pick)return `<p class="label">No upcoming class days on the calendar.</p>`;
    const b=button(wuLabel,pick.wu,pick.wuLink)+button(etLabel,pick.et,pick.etLink);
    return `<p class="label">${label}</p><p class="sub">${esc(pick.topic)}</p>`+(b||`<p class="note">No warm up or quiz today.</p>`);
  }

  if(view==="unit"){
    app.style.padding="0";document.body.style.background="transparent";
    const t=days.find(x=>x.d>=now&&!offDay(x.topic))||days[days.length-1];
    const u=(t&&units[t.unit])||{};
    const part=(txt,label,icon)=>{if(!txt)return "";const m=txt.match(/^\s*(WHAT|WHY|HOW)\s*:\s*/i);const body=m?txt.slice(m[0].length):txt;
      return `<div class="wwh"><span class="wwhl">${icon} ${label}</span><span>${esc(body)}</span></div>`;};
    const q=(u.q||"").replace(/^❓\s*/,"");
    app.innerHTML=`<div class="unitbox"><p class="uname">${esc(t?t.unit:"")}</p>`+(q?`<p class="uq">❓ ${esc(q)}</p>`:"")+
      part(u.what,"WHAT","📘")+part(u.why,"WHY","💡")+part(u.how,"HOW","✅")+`</div>`;
    return;
  }

  if(view==="checkin"){
    const t=days.find(x=>sameDay(x.d,now)&&!offDay(x.topic));
    const nice=now.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
    app.innerHTML=`<div class="cibox"><p class="cidate">📅 ${esc(nice)}</p>`+
      (t&&t.ci?`<p class="cilabel">Today's Check In</p><p class="ciq">${esc(t.ci)}</p>`:`<p class="ciq">There's no check in today.</p>`)+`</div>`;
    return;
  }

  if(view==="scroll"||view==="both"){
    document.body.classList.add("scrollview"); if(view==="both")document.body.classList.add("both"); app.style.textAlign="left";
    const target=days.find(x=>x.d>=now&&!offDay(x.topic))||days[days.length-1];
    const cell=(t,u)=>u?`<a class="mini" href="${esc(u)}" target="_top">${esc(t)}</a>`:(t?`<span class="mini off" title="Link coming soon">${esc(t)}</span>`:"");
    let html=`<div class="topbar"><h3>📅 Math 2 Calendar</h3><button class="jump" onclick="jumpToday()">Jump to today</button></div><div class="scroller" id="sc"><table><thead><tr><th>Date</th><th>Topic</th><th>${esc(wuLabel)}</th><th>${esc(etLabel)}</th><th>Practice</th><th>Check In</th></tr></thead><tbody>`;
    let lastUnit=null;
    days.forEach(x=>{
      if(x.unit!==lastUnit){html+=`<tr class="unit"><td colspan="6">${esc(x.unit)}</td></tr>`;lastUnit=x.unit;}
      const cls=[x===target?"today":"",offDay(x.topic)?"off":"",x.d<now&&x!==target?"past":""].join(" ");
      html+=`<tr class="${cls}" ${x===target?'id="target"':""}><td style="white-space:nowrap">${esc(x.date)}${x===target&&!sameDay(x.d,now)?"<br><small>next class</small>":""}</td><td>${esc(x.topic)}</td><td>${cell(x.wu,x.wuLink)}</td><td>${cell(x.et,x.etLink)}</td><td class="sm">${esc(x.prac)}</td><td class="sm">${esc(x.ci)}</td></tr>`;
    });
    app.innerHTML=(view==="both"?`<div class="todaybox">${buttonsHTML()}</div>`:"")+html+"</tbody></table></div>";
    window.jumpToday=()=>{const sc=document.getElementById("sc"),r=document.getElementById("target");if(!sc||!r)return;
      const prev=r.previousElementSibling;const top=(prev?prev.offsetTop:r.offsetTop)-sc.querySelector("thead").offsetHeight;sc.scrollTop=Math.max(0,top);};
    jumpToday(); setTimeout(jumpToday,300);
    return;
  }

  if(view==="week"){
    const mon=new Date(now); const dow=now.getDay();
    mon.setDate(now.getDate()-((dow+6)%7) + (dow===6||dow===0?7:0));   // weekends show next week
    const end=new Date(mon); end.setDate(mon.getDate()+12);           // this week + next week
    const list=days.filter(x=>x.d>=mon && x.d<=end);
    let html=`<h3>📅 This Week &amp; Next Week</h3><table><thead><tr><th>Date</th><th>Topic</th><th>${esc(wuLabel)}</th><th>${esc(etLabel)}</th><th>Practice</th><th>Check In</th></tr></thead><tbody>`;
    let lastUnit="";
    list.forEach(x=>{
      if(x.unit!==lastUnit){html+=`<tr class="unit"><td colspan="6">${esc(x.unit)}</td></tr>`;lastUnit=x.unit;}
      const cls=sameDay(x.d,now)?"today":(offDay(x.topic)?"off":"");
      const l=(t,u)=>u?`<a href="${esc(u)}" target="_top">${esc(t)}</a>`:esc(t);
      html+=`<tr class="${cls}"><td>${esc(x.date)}</td><td>${esc(x.topic)}</td><td>${l(x.wu,x.wuLink)}</td><td>${l(x.et,x.etLink)}</td><td class="sm">${esc(x.prac)}</td><td class="sm">${esc(x.ci)}</td></tr>`;
    });
    app.innerHTML=html+"</tbody></table>"+(list.length?"":`<p class="note">No class days on the calendar for these two weeks.</p>`);
    return;
  }

  // buttons view
  app.innerHTML=buttonsHTML();
 })
 .catch(e=>{document.getElementById("app").innerHTML=`<p class="note">Today\'s work couldn\'t load. Check the Math 2 calendar in Canvas.</p>`+(view==="debug"?`<pre>${esc(String(e))}</pre>`:"");});
</script>
</body>
</html>
